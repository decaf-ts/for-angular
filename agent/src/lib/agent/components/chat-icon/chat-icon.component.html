<svg
  class="chat-icon"
  [class.chat-icon--spin]="name() === 'loader'"
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="strokeWidth()"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.role]="title() ? 'img' : null"
  [attr.aria-label]="title()"
  [attr.aria-hidden]="title() ? null : 'true'"
  focusable="false"
>
  @if (title(); as label) {
    <title>{{ label }}</title>
  }
  @switch (name()) {
    @case ("bot") {
      <rect x="3" y="7" width="18" height="12" rx="2" />
      <path d="M12 3v4" />
      <circle cx="9" cy="13" r="1" />
      <circle cx="15" cy="13" r="1" />
      <path d="M9 17h6" />
    }
    @case ("user") {
      <circle cx="12" cy="8" r="4" />
      <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
    }
    @case ("attachment") {
      <path d="M21 11.5a8.38 8.38 0 0 1-2.46 5.93 8.5 8.5 0 0 1-12-12l7.07-7.07a5 5 0 0 1 7.07 7.07l-7.07 7.07a2.5 2.5 0 0 1-3.54-3.54l6.36-6.36" />
    }
    @case ("file") {
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
      <path d="M14 3v5h5" />
    }
    @case ("check") {
      <path d="M5 12l5 5L20 7" />
    }
    @case ("unchecked") {
      <circle cx="12" cy="12" r="9" />
    }
    @case ("loader") {
      <path d="M12 3a9 9 0 1 0 9 9" />
    }
    @case ("trash") {
      <path d="M4 7h16" />
      <path d="M10 11v6" />
      <path d="M14 11v6" />
      <path d="M5 7l1 13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-13" />
      <path d="M9 7V4h6v3" />
    }
    @case ("upload") {
      <path d="M12 16V4" />
      <path d="M7 9l5-5 5 5" />
      <path d="M4 20h16" />
    }
    @case ("download") {
      <path d="M12 4v12" />
      <path d="M7 11l5 5 5-5" />
      <path d="M4 20h16" />
    }
    @case ("menu") {
      <path d="M4 6h16" />
      <path d="M4 12h16" />
      <path d="M4 18h16" />
    }
    @case ("pencil") {
      <path d="M4 20h4l10-10-4-4L4 16z" />
      <path d="M13.5 6.5l4 4" />
    }
    @case ("invoice") {
      <path d="M6 3h9l3 3v15l-3-2-3 2-3-2-3 2z" />
      <path d="M9 8h6" />
      <path d="M9 12h6" />
      <path d="M9 16h4" />
    }
    @case ("box") {
      <path d="M21 8l-9-5-9 5 9 5 9-5z" />
      <path d="M3 8v8l9 5 9-5V8" />
      <path d="M12 13v8" />
    }
    @case ("gps") {
      <path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z" />
      <circle cx="12" cy="10" r="2.5" />
    }
    @case ("home") {
      <path d="M3 11l9-8 9 8" />
      <path d="M5 10v10h14V10" />
      <path d="M10 20v-6h4v6" />
    }
    @case ("send") {
      <path d="M21 3L10 14" />
      <path d="M21 3l-7 18-4-7-7-4z" />
    }
    @case ("stop") {
      <rect x="6" y="6" width="12" height="12" rx="2" />
    }
    @case ("copy") {
      <rect x="8" y="8" width="12" height="12" rx="2" />
      <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
    }
    @case ("vote-up") {
      <path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z" />
      <path d="M7 11l4-8a2 2 0 0 1 2 2v4h5a2 2 0 0 1 2 2l-2 7a2 2 0 0 1-2 1H7" />
    }
    @case ("vote-down") {
      <path d="M7 13V4H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1z" />
      <path d="M7 13l4 8a2 2 0 0 0 2-2v-4h5a2 2 0 0 0 2-2l-2-7a2 2 0 0 0-2-1H7" />
    }
    @case ("chevron-down") {
      <path d="M6 9l6 6 6-6" />
    }
    @case ("chevron-up") {
      <path d="M6 15l6-6 6 6" />
    }
    @case ("sparkles") {
      <path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z" />
      <path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z" />
    }
    @case ("x") {
      <path d="M6 6l12 12" />
      <path d="M18 6L6 18" />
    }
    @case ("info") {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 11v5" />
      <path d="M12 8h.01" />
    }
    @case ("refresh") {
      <path d="M20 12a8 8 0 1 1-2.34-5.66" />
      <path d="M20 4v4h-4" />
    }
    @case ("image") {
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <circle cx="9" cy="10" r="1.5" />
      <path d="M21 16l-5-5-9 9" />
    }
    @default {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 8v4" />
      <path d="M12 16h.01" />
    }
  }
</svg>
