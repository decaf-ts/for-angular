@if (showHandle()) {
  <span
    class="dcf-kanban-card__handle"
    cdkDragHandle
    aria-hidden="true"
    title="Drag"
  >
    <svg viewBox="0 0 12 20" focusable="false" aria-hidden="true">
      <circle cx="3" cy="4" r="1.4" />
      <circle cx="9" cy="4" r="1.4" />
      <circle cx="3" cy="10" r="1.4" />
      <circle cx="9" cy="10" r="1.4" />
      <circle cx="3" cy="16" r="1.4" />
      <circle cx="9" cy="16" r="1.4" />
    </svg>
  </span>
}
<div class="dcf-kanban-card__body">
  @if (template()) {
    <ng-container
      [ngTemplateOutlet]="template()"
      [ngTemplateOutletContext]="templateContext()"
    />
  } @else {
    <span class="dcf-kanban-card__title">{{ title() }}</span>
  }
</div>
