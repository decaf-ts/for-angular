<div
  class="dcf-icon-component"
  #component
>
  @if (initialized) {
    @if (button) {
      <ion-button
        [fill]="buttonFill"
        [shape]="buttonShape"
        [color]="isDarkMode ? 'light' : color"
        [size]="size"
      >
        @if (type === 'image') {
          @if (isSvg) {
            <span
              aria-hidden="true"
              [slot]="slot"
              [class]="color ? 'dcf-color-' + color : ''"
              [style.width]="width"
              [ngx-decaf-svg]="name"
            ></span>
          } @else {
            <img
              aria-hidden="true"
              [alt]="name"
              [title]="name"
              [slot]="slot"
              [src]="name"
              [style.width]="width"
              title="icon"
            />
          }
        }
        @if (type === 'ionic') {
          <ion-icon
            aria-hidden="true"
            [slot]="slot"
            [ios]="name"
            [md]="name"
            [color]="isDarkMode ? 'light' : color"
            [name]="name"
          />
        }
        @if (type === 'icon') {
          <span
            aria-hidden="true"
            [slot]="slot"
            [class]="
              'dcf-icon-button dcf-tabler-icon ti ' +
              name +
              ' ' +
              size +
              ' dcf-color-' +
              color
            "
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <use
                [attr.href]="tablerSpritePath + '#tabler-' + name.slice(3)"
              ></use>
            </svg>
          </span>
        }
      </ion-button>
    } @else {
      @if (type === 'image') {
        @if (isSvg) {
          <span
            aria-hidden="true"
            [slot]="slot"
            [class]="color ? 'dcf-color-' + color : ''"
            [style.width]="width"
            [ngx-decaf-svg]="name"
          ></span>
        } @else {
          <img
            aria-hidden="true"
            [alt]="name"
            [title]="name"
            [slot]="slot"
            [src]="name"
            [style.width]="width"
            title="icon"
          />
        }
      }
      @if (type === 'ionic') {
        <ion-icon
          aria-hidden="true"
          [slot]="slot"
          [ios]="name"
          [md]="name"
          [size]="size"
          [color]="isDarkMode ? 'light' : color"
          [name]="name"
        />
      }
      @if (type === 'icon') {
        <span
          aria-hidden="true"
          [slot]="slot"
          [class]="
            'dcf-tabler-icon ti ' + name + ' ' + size + ' dcf-color-' + color
          "
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <use
              [attr.href]="tablerSpritePath + '#tabler-' + name.slice(3)"
            ></use>
          </svg>
        </span>
      }
    }
  }
</div>
