<app-header title="{{ 'cron_selector.title' | translate }}" />

<ion-content
  fullscreen="true"
  [scrollY]="true"
>
  <main>
    <ngx-decaf-container>
      <ngx-decaf-cron-selector
        [(value)]="medicationCron"
        (cronChange)="onCronChange($event)"
      />

      <div class="dcf-current-cron">
        {{ 'cron_selector.current_cron' | translate }}
        <code>{{ medicationCron }}</code>
      </div>
    </ngx-decaf-container>
  </main>
</ion-content>
