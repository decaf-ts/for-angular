@if (item) {
  <div
    class="graph-workflow-item"
    role="listitem"
  >
    <button
      type="button"
      class="graph-workflow-item__open"
      (click)="openWorkflowPage($event)"
    >
      <span class="graph-workflow-item__icon">
        <ngx-decaf-icon
          color="tertiary"
          name="ti-sitemap"
        />
      </span>
      <span class="graph-workflow-item__content">
        <span class="graph-workflow-item__name">
          {{ item.name || (locale + '.untitled' | translate) }}
        </span>
        <span class="graph-workflow-item__meta">
          {{ locale + '.updatedAt.label' | translate }}: {{ item.updatedAt }}
        </span>
      </span>
    </button>
    <div class="graph-workflow-item__actions">
      <ion-button
        (click)="pastExecutions($event)"
        [attr.aria-label]="locale + '.runs' | translate"
        fill="clear"
        shape="round"
        color="primary"
      >
        <ngx-decaf-icon
          name="ti-history"
          color="primary"
        />
      </ion-button>
      <ion-button
        (click)="runScenario($event)"
        [disabled]="!canRunScenario()"
        [attr.aria-label]="runLabelKey() | translate"
        [title]="runLabelKey() | translate"
        fill="clear"
        shape="round"
        color="primary"
      >
        <ngx-decaf-icon
          name="ti-player-play"
          color="primary"
        />
      </ion-button>
      <ion-button
        (click)="openWorkflow($event)"
        [attr.aria-label]="locale + '.open' | translate"
        fill="clear"
        shape="round"
        color="primary"
      >
        <ngx-decaf-icon
          name="ti-edit"
          color="primary"
        />
      </ion-button>
    </div>
  </div>
}
