<div class="graph-float-controls">
  <div class="graph-float-controls__group graph-float-controls__group--left">
    <button
      type="button"
      class="graph-float-btn"
      [disabled]="!canUndo()"
      (click)="onUndo()"
      title="Undo (Ctrl/Cmd+Z)"
    >
      &#x21A9;
    </button>
    <button
      type="button"
      class="graph-float-btn"
      [disabled]="!canRedo()"
      (click)="onRedo()"
      title="Redo (Ctrl/Cmd+Shift+Z)"
    >
      &#x21AA;
    </button>
  </div>

  <div class="graph-float-controls__group graph-float-controls__group--right">
    <div class="graph-float-toggle" title="Auto-Save">
      <ion-toggle
        [checked]="autoSaveEnabled()"
        (ionChange)="onAutoSaveToggle($event)"
      />
    </div>

    <button
      type="button"
      class="graph-float-btn graph-float-btn--save"
      [disabled]="saveDisabled()"
      [attr.aria-disabled]="saveDisabled()"
      (click)="onSave()"
      [title]="saveTitle()"
    >
      @if (isSaving()) {
        <ion-spinner name="circular" style="width: 14px; height: 14px;" />
      } @else {
        Save
      }
    </button>

    @if (invalid()) {
      <span
        class="graph-float-btn graph-float-btn--invalid"
        role="status"
        [title]="runTitle()"
      >
        Invalid ({{ validationIssues().length }})
      </span>
    }

    @if (isRunning()) {
      <button
        type="button"
        class="graph-float-btn graph-float-btn--cancel"
        (click)="onCancel()"
        title="Cancel run"
      >
        Cancel
      </button>
    }

    @if (hasRun() && !isRunning()) {
      <button
        type="button"
        class="graph-float-btn graph-float-btn--edit"
        (click)="onEdit()"
        title="Back to edit mode"
      >
        Edit
      </button>
    }

    <button
      type="button"
      class="graph-float-btn graph-float-btn--run"
      [class.graph-float-btn--running]="isRunning()"
      [disabled]="runDisabled()"
      [attr.aria-disabled]="runDisabled()"
      [title]="runTitle()"
      (click)="onRun()"
    >
      {{ isRunning() ? '...' : 'Start' }}
    </button>
  </div>
</div>
